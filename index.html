<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Xelum</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --oro-chiaro: #f5e6c8;
      --oro: #d8b06a;
      --oro-scuro: #8b5e34;
      --marrone: #2a1f16;
      --marrone-scuro: #17120e;
      --nero: #0b0b0d;
      --testo: #f8edd8;
      --ombra: rgba(0, 0, 0, 0.5);
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at top, rgba(90, 60, 30, 0.35) 0%, transparent 30%),
        radial-gradient(circle at 20% 80%, rgba(120, 70, 30, 0.12) 0%, transparent 28%),
        radial-gradient(circle at 80% 20%, rgba(255, 210, 140, 0.08) 0%, transparent 18%),
        linear-gradient(180deg, #2a1f16 0%, #17120e 42%, #0b0b0d 100%);
      color: var(--testo);
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .background-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 20%, rgba(255, 220, 150, 0.12), transparent 30%),
        radial-gradient(circle at 50% 100%, rgba(255, 180, 80, 0.08), transparent 35%);
      animation: glowShift 7s ease-in-out infinite alternate;
      z-index: 0;
    }

    @keyframes glowShift {
      0% {
        transform: scale(1) translateY(0px);
        opacity: 0.9;
      }
      100% {
        transform: scale(1.08) translateY(-8px);
        opacity: 1;
      }
    }

    .fog,
    .fog-2 {
      position: fixed;
      left: -20%;
      width: 140%;
      height: 220px;
      border-radius: 50%;
      filter: blur(36px);
      opacity: 0.12;
      pointer-events: none;
      z-index: 1;
    }

    .fog {
      bottom: 60px;
      background: linear-gradient(90deg, rgba(255, 225, 180, 0.18), rgba(255, 255, 255, 0.06), rgba(255, 225, 180, 0.18));
      animation: fogMove 18s linear infinite alternate;
    }

    .fog-2 {
      bottom: 0;
      background: linear-gradient(90deg, rgba(180, 140, 100, 0.18), rgba(255, 255, 255, 0.04), rgba(180, 140, 100, 0.18));
      animation: fogMove2 24s linear infinite alternate;
    }

    @keyframes fogMove {
      0% {
        transform: translateX(-4%) translateY(0);
      }
      100% {
        transform: translateX(4%) translateY(-10px);
      }
    }

    @keyframes fogMove2 {
      0% {
        transform: translateX(6%) translateY(0);
      }
      100% {
        transform: translateX(-6%) translateY(-6px);
      }
    }

    .particles {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .particle {
      position: absolute;
      bottom: -20px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(255, 220, 150, 0.7);
      box-shadow: 0 0 10px rgba(255, 220, 150, 0.6);
      animation: rise linear infinite;
    }

    @keyframes rise {
      from {
        transform: translateY(0) scale(1);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      80% {
        opacity: 0.8;
      }
      to {
        transform: translateY(-110vh) scale(0.4);
        opacity: 0;
      }
    }

    .page {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .home-box {
      width: 100%;
      max-width: 720px;
      text-align: center;
      animation: introFade 1.2s ease;
    }

    @keyframes introFade {
      from {
        opacity: 0;
        transform: translateY(22px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .crest {
      width: 132px;
      height: 132px;
      margin: 0 auto 18px;
      border-radius: 50%;
      border: 1px solid rgba(216, 176, 106, 0.28);
      background:
        radial-gradient(circle at 35% 30%, rgba(255, 235, 190, 0.18), transparent 35%),
        linear-gradient(180deg, rgba(90, 60, 30, 0.70), rgba(20, 14, 10, 0.88));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 0 0 8px rgba(255, 220, 150, 0.03),
        0 18px 40px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255,255,255,0.05);
      animation: crestPulse 3.4s ease-in-out infinite;
      overflow: hidden;
    }

    .crest-crown {
      width: 96px;
      height: 96px;
      display: block;
      filter: drop-shadow(0 0 10px rgba(240, 196, 107, 0.12));
    }

    @keyframes crestPulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.04);
      }
    }

    .logo {
      font-size: clamp(56px, 12vw, 120px);
      letter-spacing: 12px;
      font-weight: 700;
      color: var(--oro-chiaro);
      text-shadow:
        0 0 10px rgba(255, 220, 160, 0.20),
        0 0 28px rgba(255, 190, 80, 0.14),
        0 6px 20px rgba(0, 0, 0, 0.65);
      margin-bottom: 8px;
      animation: logoBreath 4s ease-in-out infinite;
    }

    @keyframes logoBreath {
      0%, 100% {
        transform: scale(1);
        text-shadow:
          0 0 10px rgba(255, 220, 160, 0.20),
          0 0 28px rgba(255, 190, 80, 0.14),
          0 6px 20px rgba(0, 0, 0, 0.65);
      }
      50% {
        transform: scale(1.03);
        text-shadow:
          0 0 18px rgba(255, 220, 160, 0.35),
          0 0 40px rgba(255, 190, 80, 0.22),
          0 8px 28px rgba(0, 0, 0, 0.72);
      }
    }

    .subtitle {
      font-size: 15px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #d9c29a;
      opacity: 0.92;
      margin-bottom: 34px;
    }

    .menu-panel {
      max-width: 430px;
      margin: 0 auto;
      padding: 24px;
      border-radius: 24px;
      background:
        linear-gradient(180deg, rgba(44, 33, 24, 0.88), rgba(19, 15, 12, 0.93));
      border: 1px solid rgba(216, 176, 106, 0.18);
      box-shadow:
        0 22px 60px rgba(0, 0, 0, 0.48),
        inset 0 1px 0 rgba(255,255,255,0.04);
      backdrop-filter: blur(4px);
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .menu-btn {
      position: relative;
      overflow: hidden;
      width: 100%;
      padding: 16px 18px;
      border: 1px solid rgba(255, 220, 160, 0.08);
      border-radius: 16px;
      background: linear-gradient(180deg, #8b5e34, #6e4725);
      color: #fff4e2;
      font-size: 20px;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.38);
      transition: transform 0.22s ease, box-shadow 0.22s ease, filter 0.22s ease;
    }

    .menu-btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: -120%;
      width: 70%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
      transform: skewX(-20deg);
      transition: left 0.45s ease;
    }

    .menu-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.5);
      filter: brightness(1.05);
    }

    .menu-btn:hover::before {
      left: 140%;
    }

    .menu-btn.secondary {
      background: linear-gradient(180deg, #5d4631, #463326);
    }

    .small-note {
      margin-top: 18px;
      font-size: 13px;
      color: #bba786;
      opacity: 0.85;
    }

    .popup {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.76);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
      z-index: 10;
    }

    .popup.active {
      opacity: 1;
      visibility: visible;
    }

    .popup-box {
      width: 100%;
      max-width: 560px;
      border-radius: 24px;
      padding: 28px 24px;
      background:
        linear-gradient(180deg, rgba(46, 34, 24, 0.97), rgba(20, 15, 11, 0.98));
      border: 1px solid rgba(216, 176, 106, 0.18);
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.62);
      transform: translateY(18px) scale(0.97);
      transition: transform 0.3s ease;
      text-align: center;
    }

    .popup.active .popup-box {
      transform: translateY(0) scale(1);
    }

    .popup-title {
      font-size: 32px;
      color: var(--oro-chiaro);
      margin-bottom: 14px;
    }

    .popup-text {
      color: #eadac0;
      line-height: 1.65;
      font-size: 17px;
      margin-bottom: 20px;
    }

    .popup-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .close-btn {
      padding: 12px 20px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(180deg, #8b5e34, #6e4725);
      color: white;
      font-family: inherit;
      font-size: 16px;
      cursor: pointer;
    }

    .footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 16px;
      text-align: center;
      font-size: 12px;
      letter-spacing: 1px;
      color: #a79372;
      opacity: 0.7;
      z-index: 2;
      pointer-events: none;
    }

    @media (max-width: 640px) {
      .crest {
        width: 108px;
        height: 108px;
        margin-bottom: 16px;
      }

      .crest-crown {
        width: 76px;
        height: 76px;
      }

      .logo {
        letter-spacing: 6px;
      }

      .subtitle {
        font-size: 13px;
        letter-spacing: 2px;
        margin-bottom: 24px;
      }

      .menu-panel {
        padding: 18px;
      }

      .menu-btn {
        font-size: 18px;
        padding: 15px 16px;
      }

      .popup-title {
        font-size: 26px;
      }

      .popup-text {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="background-glow"></div>
  <div class="fog"></div>
  <div class="fog-2"></div>

  <div class="particles" id="particles"></div>

  <main class="page">
    <section class="home-box">
      <div class="crest">
        <svg class="crest-crown" viewBox="0 0 256 256" aria-hidden="true">
          <defs>
            <linearGradient id="goldMain" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#fff1b8"></stop>
              <stop offset="18%" stop-color="#f7d778"></stop>
              <stop offset="45%" stop-color="#d9a63e"></stop>
              <stop offset="72%" stop-color="#b9781f"></stop>
              <stop offset="100%" stop-color="#8b5718"></stop>
            </linearGradient>

            <linearGradient id="goldDark" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#c98b2c"></stop>
              <stop offset="100%" stop-color="#6f4515"></stop>
            </linearGradient>

            <radialGradient id="gemRed" cx="50%" cy="35%" r="70%">
              <stop offset="0%" stop-color="#ffb0b0"></stop>
              <stop offset="45%" stop-color="#d63b3b"></stop>
              <stop offset="100%" stop-color="#7e1414"></stop>
            </radialGradient>

            <radialGradient id="gemBlue" cx="50%" cy="35%" r="70%">
              <stop offset="0%" stop-color="#b9dcff"></stop>
              <stop offset="45%" stop-color="#3f86e8"></stop>
              <stop offset="100%" stop-color="#173f86"></stop>
            </radialGradient>

            <filter id="crownGlow" x="-40%" y="-40%" width="180%" height="180%">
              <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f0c46b" flood-opacity="0.35"></feDropShadow>
            </filter>

            <filter id="crownShadow" x="-40%" y="-40%" width="180%" height="180%">
              <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"></feDropShadow>
            </filter>
          </defs>

          <g filter="url(#crownShadow)">
            <ellipse cx="128" cy="198" rx="66" ry="16" fill="rgba(0,0,0,0.22)"></ellipse>

            <path
              d="M60 84
                 L92 122
                 L128 62
                 L164 122
                 L196 84
                 L212 160
                 Q212 172 202 180
                 Q190 190 174 190
                 L82 190
                 Q66 190 54 180
                 Q44 172 44 160
                 Z"
              fill="url(#goldMain)"
              stroke="#f8df9a"
              stroke-width="6"
              stroke-linejoin="round"
              filter="url(#crownGlow)">
            </path>

            <path
              d="M58 152
                 Q128 174 198 152
                 L198 170
                 Q128 194 58 170
                 Z"
              fill="url(#goldDark)"
              opacity="0.95">
            </path>

            <rect x="56" y="176" width="144" height="18" rx="9" fill="url(#goldDark)" stroke="#f0cf84" stroke-width="4"></rect>

            <circle cx="60" cy="84" r="10" fill="#f6d26d" stroke="#fff2ba" stroke-width="3"></circle>
            <circle cx="92" cy="122" r="8" fill="#f6d26d" stroke="#fff2ba" stroke-width="3"></circle>
            <circle cx="128" cy="62" r="12" fill="#f6d26d" stroke="#fff2ba" stroke-width="3"></circle>
            <circle cx="164" cy="122" r="8" fill="#f6d26d" stroke="#fff2ba" stroke-width="3"></circle>
            <circle cx="196" cy="84" r="10" fill="#f6d26d" stroke="#fff2ba" stroke-width="3"></circle>

            <circle cx="98" cy="162" r="11" fill="url(#gemBlue)" stroke="#d9eeff" stroke-width="3"></circle>
            <circle cx="128" cy="168" r="14" fill="url(#gemRed)" stroke="#ffd0d0" stroke-width="3"></circle>
            <circle cx="158" cy="162" r="11" fill="url(#gemBlue)" stroke="#d9eeff" stroke-width="3"></circle>

            <path
              d="M70 144
                 Q128 158 186 144"
              fill="none"
              stroke="#fff0b5"
              stroke-width="4"
              opacity="0.55">
            </path>
          </g>
        </svg>
      </div>

      <h1 class="logo">XELUM</h1>
      <p class="subtitle">Il destino del regno e nelle tue mani</p>

      <div class="menu-panel">
        <div class="menu">
          <button class="menu-btn" onclick="nuovoRegno()">Nuovo Regno</button>
          <button class="menu-btn" onclick="continuaRegno()">Continua Regno</button>
          <button class="menu-btn secondary" onclick="openPopup('impostazioni')">Impostazioni</button>
          <button class="menu-btn secondary" onclick="openPopup('tutorial')">Tutorial</button>
          <button class="menu-btn secondary" onclick="openPopup('donazioni')">Donazioni</button>
        </div>

        <div class="small-note">
          Un regno. Quattro equilibri. Infinite conseguenze.
        </div>
      </div>
    </section>
  </main>

  <div class="popup" id="popup" onclick="closePopup(event)">
    <div class="popup-box">
      <h2 class="popup-title" id="popupTitle"></h2>
      <p class="popup-text" id="popupText"></p>
      <div class="popup-actions">
        <button class="close-btn" onclick="closePopup()">Chiudi</button>
      </div>
    </div>
  </div>

  <div class="footer">
    Xelum - Strategia narrativa fantasy
  </div>

  <script>
    function nuovoRegno() {
      window.location.href = "game.html?new=1";
    }

    function continuaRegno() {
      const save = localStorage.getItem("xelum-save");

      if (save) {
        window.location.href = "game.html?continue=1";
      } else {
        openPopup("nessun_salvataggio");
      }
    }

    function openPopup(type) {
      const popup = document.getElementById("popup");
      const title = document.getElementById("popupTitle");
      const text = document.getElementById("popupText");

      if (type === "impostazioni") {
        title.textContent = "Impostazioni";
        text.textContent = "Questa sezione puo diventare il centro di controllo di Xelum. Nei prossimi step possiamo aggiungere musica attiva o disattiva, volume, animazioni, vibrazione su mobile, difficolta e tema visivo.";
      }

      if (type === "tutorial") {
        title.textContent = "Tutorial";
        text.textContent = "In Xelum governi il regno scegliendo tra due decisioni. Nel gioco scorri la carta verso sinistra o verso destra. Ogni scelta modifica Popolo, Esercito, Oro e Fede. Se una di queste risorse arriva a zero, il regno finisce.";
      }

      if (type === "donazioni") {
        title.textContent = "Donazioni";
        text.textContent = "Se vuoi sostenere lo sviluppo di Xelum, qui potremo inserire un pulsante PayPal, Ko-fi, Buy Me a Coffee oppure una pagina dedicata ai sostenitori del regno.";
      }

      if (type === "nessun_salvataggio") {
        title.textContent = "Nessun regno salvato";
        text.textContent = "Non e stato trovato alcun salvataggio locale. Inizia un Nuovo Regno e poi, nel prossimo aggiornamento, collegheremo il salvataggio automatico per rendere attivo il tasto Continua Regno.";
      }

      popup.classList.add("active");
    }

    function closePopup(event) {
      if (event && event.target !== event.currentTarget) return;
      document.getElementById("popup").classList.remove("active");
    }

    function createParticles() {
      const container = document.getElementById("particles");
      const total = 28;

      for (let i = 0; i < total; i++) {
        const p = document.createElement("span");
        p.className = "particle";
        p.style.left = Math.random() * 100 + "%";
        p.style.animationDuration = 8 + Math.random() * 10 + "s";
        p.style.animationDelay = Math.random() * 10 + "s";
        p.style.opacity = 0.35 + Math.random() * 0.6;
        const size = 2 + Math.random() * 4;
        p.style.width = size + "px";
        p.style.height = size + "px";
        container.appendChild(p);
      }
    }

    createParticles();
  </script>
</body>
</html>
