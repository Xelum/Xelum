<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Xelum</title>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: radial-gradient(circle at top, #2a1f16 0%, #17120e 35%, #0b0b0d 100%);
      color: #f3e7d0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      touch-action: pan-y;
    }

    .app {
      width: 100%;
      max-width: 520px;
    }

    .topbar {
      text-align: center;
      margin-bottom: 18px;
    }

    .title {
      font-size: 42px;
      font-weight: 700;
      letter-spacing: 1px;
      margin: 0 0 8px;
      color: #f5e6c8;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
    }

    .day {
      font-size: 16px;
      color: #d2b98b;
    }

    .stats-panel {
      background: rgba(25, 20, 16, 0.92);
      border: 1px solid rgba(210, 185, 139, 0.18);
      border-radius: 18px;
      padding: 16px 14px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.35);
      margin-bottom: 18px;
      backdrop-filter: blur(3px);
    }

    .stat {
      margin-bottom: 14px;
    }

    .stat:last-child {
      margin-bottom: 0;
    }

    .stat-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 7px;
      font-size: 15px;
      color: #f2e7d3;
    }

    .bar {
      width: 100%;
      height: 14px;
      background: #3a2f26;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.35s ease;
    }

    .fill-popolo { background: linear-gradient(90deg, #6f4fd8, #8f72ff); }
    .fill-esercito { background: linear-gradient(90deg, #6b6f7a, #a7adba); }
    .fill-oro { background: linear-gradient(90deg, #b8860b, #ffd15c); }
    .fill-fede { background: linear-gradient(90deg, #7a5a2b, #d9b26b); }

    .card-area {
      position: relative;
      height: 340px;
      margin-top: 8px;
    }

    .choice-hint {
      position: absolute;
      top: 18px;
      width: 130px;
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0;
      transition: opacity 0.15s ease;
      z-index: 1;
      pointer-events: none;
    }

    .choice-left {
      left: 10px;
      text-align: left;
      color: #d96a6a;
    }

    .choice-right {
      right: 10px;
      text-align: right;
      color: #7ed48a;
    }

    .choice-hint.visible {
      opacity: 1;
    }

    .card {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(61, 47, 33, 0.97), rgba(33, 26, 21, 0.97));
      border: 1px solid rgba(222, 190, 134, 0.22);
      border-radius: 24px;
      padding: 30px 24px;
      min-height: 280px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.04);
      overflow: hidden;
      touch-action: none;
      cursor: grab;
      transition: transform 0.25s ease;
    }

    .card.dragging {
      transition: none;
      cursor: grabbing;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top, rgba(255, 220, 160, 0.08), transparent 40%);
      pointer-events: none;
    }

    .card-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #c7ab78;
      margin-bottom: 14px;
      position: relative;
      z-index: 1;
    }

    .card-text {
      font-size: 28px;
      line-height: 1.35;
      color: #fff5df;
      max-width: 400px;
      position: relative;
      z-index: 1;
    }

    .buttons {
      display: flex;
      justify-content: center;
      margin-top: 18px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 14px 18px;
      min-width: 220px;
      font-size: 16px;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      background: #8b5e34;
      color: #fff4e2;
      font-weight: 700;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .hidden {
      display: none;
    }

    .gameover {
      color: #ffcf9d;
    }

    @media (max-width: 640px) {
      .title {
        font-size: 34px;
      }

      .card-area {
        height: 300px;
      }

      .card {
        padding: 24px 18px;
      }

      .card-text {
        font-size: 23px;
      }

      button {
        width: 100%;
        min-width: 0;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <h1 class="title">Xelum</h1>
      <div class="day">Giorno <span id="giorno">1</span> di regno</div>
    </div>

    <div class="stats-panel">
      <div class="stat">
        <div class="stat-head"><span>👥 Popolo</span><span id="popoloValue">50</span></div>
        <div class="bar"><div class="fill fill-popolo" id="popoloBar" style="width: 50%;"></div></div>
      </div>

      <div class="stat">
        <div class="stat-head"><span>⚔️ Esercito</span><span id="esercitoValue">50</span></div>
        <div class="bar"><div class="fill fill-esercito" id="esercitoBar" style="width: 50%;"></div></div>
      </div>

      <div class="stat">
        <div class="stat-head"><span>💰 Oro</span><span id="oroValue">50</span></div>
        <div class="bar"><div class="fill fill-oro" id="oroBar" style="width: 50%;"></div></div>
      </div>

      <div class="stat">
        <div class="stat-head"><span>⛪ Fede</span><span id="fedeValue">50</span></div>
        <div class="bar"><div class="fill fill-fede" id="fedeBar" style="width: 50%;"></div></div>
      </div>
    </div>

    <div class="card-area">
      <div class="choice-hint choice-left" id="leftHint">Sinistra</div>
      <div class="choice-hint choice-right" id="rightHint">Destra</div>

      <div class="card" id="gameCard">
        <div class="card-label">Consiglio del regno</div>
        <div class="card-text" id="testoCarta">
          Un mercante chiede meno tasse per aiutare il popolo.
        </div>
      </div>
    </div>

    <div class="buttons hidden" id="regnoButtons">
      <button onclick="vaiAlGiornoSuccessivo()">Vai al giorno successivo</button>
    </div>
  </div>

  <script>
    const game = {
      giorno: 1,
      popolo: 50,
      esercito: 50,
      oro: 50,
      fede: 50,
      sceltaCorrente: null,
      gameOver: false,
      lockChoice: false
    };

    const eventi = [
      {
        testo: "Un mercante chiede meno tasse per aiutare il popolo.",
        sinistra: {
          etichetta: "Rifiuta",
          testoConseguenza: "Hai mantenuto le imposte. Il tesoro cresce, ma nelle strade aumenta il malcontento.",
          effetti: { popolo: -6, esercito: 0, oro: 5, fede: 0 }
        },
        destra: {
          etichetta: "Accetta",
          testoConseguenza: "Hai abbassato le tasse. Il popolo approva, ma le casse del regno si fanno più leggere.",
          effetti: { popolo: 6, esercito: 0, oro: -6, fede: 0 }
        }
      },
      {
        testo: "Il comandante chiede nuovi fondi per addestrare l'esercito.",
        sinistra: {
          etichetta: "Rifiuta",
          testoConseguenza: "Hai negato nuovi fondi. Il tesoro regge, ma i soldati si sentono trascurati.",
          effetti: { popolo: 0, esercito: -7, oro: 3, fede: 0 }
        },
        destra: {
          etichetta: "Finanzia",
          testoConseguenza: "Hai rinforzato l'addestramento. L'esercito cresce, ma l'oro diminuisce.",
          effetti: { popolo: 0, esercito: 7, oro: -7, fede: 0 }
        }
      },
      {
        testo: "Un vescovo chiede una donazione per restaurare il tempio.",
        sinistra: {
          etichetta: "Rifiuta",
          testoConseguenza: "Hai rifiutato l'offerta. Conservi oro, ma il clero guarda con freddezza il trono.",
          effetti: { popolo: 0, esercito: 0, oro: 2, fede: -7 }
        },
        destra: {
          etichetta: "Dona",
          testoConseguenza: "Il tempio verrà restaurato. La fede si rafforza, ma spendi parte del tesoro.",
          effetti: { popolo: 0, esercito: 0, oro: -5, fede: 8 }
        }
      },
      {
        testo: "I contadini chiedono più grano dai magazzini reali.",
        sinistra: {
          etichetta: "Nega",
          testoConseguenza: "Hai protetto le scorte. Il regno conserva risorse, ma il popolo soffre.",
          effetti: { popolo: -8, esercito: 0, oro: 3, fede: 0 }
        },
        destra: {
          etichetta: "Concedi",
          testoConseguenza: "Hai aperto i granai. Il popolo ti acclama, ma le riserve del regno si riducono.",
          effetti: { popolo: 8, esercito: 0, oro: -5, fede: 0 }
        }
      }
    ];

    const card = document.getElementById("gameCard");
    const leftHint = document.getElementById("leftHint");
    const rightHint = document.getElementById("rightHint");

    let isDragging = false;
    let startX = 0;
    let currentX = 0;

    function limitaStat(valore) {
      if (valore < 0) return 0;
      if (valore > 100) return 100;
      return valore;
    }

    function aggiornaStatistiche() {
      document.getElementById("giorno").textContent = game.giorno;
      document.getElementById("popoloValue").textContent = game.popolo;
      document.getElementById("esercitoValue").textContent = game.esercito;
      document.getElementById("oroValue").textContent = game.oro;
      document.getElementById("fedeValue").textContent = game.fede;

      document.getElementById("popoloBar").style.width = game.popolo + "%";
      document.getElementById("esercitoBar").style.width = game.esercito + "%";
      document.getElementById("oroBar").style.width = game.oro + "%";
      document.getElementById("fedeBar").style.width = game.fede + "%";
    }

    function mostraHints(deltaX) {
      leftHint.classList.remove("visible");
      rightHint.classList.remove("visible");

      if (deltaX < -30) {
        leftHint.textContent = game.sceltaCorrente.sinistra.etichetta;
        leftHint.classList.add("visible");
      } else if (deltaX > 30) {
        rightHint.textContent = game.sceltaCorrente.destra.etichetta;
        rightHint.classList.add("visible");
      }
    }

    function resetCard() {
      card.style.transform = "translateX(0px) rotate(0deg)";
      leftHint.classList.remove("visible");
      rightHint.classList.remove("visible");
    }

    function aggiornaCard(deltaX) {
      const rotate = deltaX * 0.08;
      card.style.transform = `translateX(${deltaX}px) rotate(${rotate}deg)`;
      mostraHints(deltaX);
    }

    function mostraSezioneRegno() {
      document.getElementById("regnoButtons").classList.remove("hidden");
    }

    function nascondiSezioneRegno() {
      document.getElementById("regnoButtons").classList.add("hidden");
    }

    function caricaEvento() {
      if (game.gameOver) return;

      const evento = eventi[Math.floor(Math.random() * eventi.length)];
      game.sceltaCorrente = evento;
      game.lockChoice = false;

      document.getElementById("testoCarta").textContent = evento.testo;
      document.getElementById("testoCarta").classList.remove("gameover");

      nascondiSezioneRegno();
      resetCard();
    }

    function applicaScelta(lato) {
      if (game.gameOver || game.lockChoice) return;

      game.lockChoice = true;
      const scelta = game.sceltaCorrente[lato];
      const effetti = scelta.effetti;

      game.popolo = limitaStat(game.popolo + effetti.popolo);
      game.esercito = limitaStat(game.esercito + effetti.esercito);
      game.oro = limitaStat(game.oro + effetti.oro);
      game.fede = limitaStat(game.fede + effetti.fede);
      game.giorno += 1;

      aggiornaStatistiche();

      if (
        game.popolo === 0 ||
        game.esercito === 0 ||
        game.oro === 0 ||
        game.fede === 0
      ) {
        game.gameOver = true;
        document.getElementById("testoCarta").textContent =
          scelta.testoConseguenza + " Il tuo regno è crollato: una delle risorse è arrivata a zero.";
        document.getElementById("testoCarta").classList.add("gameover");
        resetCard();
        return;
      }

      document.getElementById("testoCarta").textContent = scelta.testoConseguenza;
      resetCard();
      mostraSezioneRegno();
    }

    function vaiAlGiornoSuccessivo() {
      caricaEvento();
    }

    card.addEventListener("pointerdown", (e) => {
      if (game.gameOver || game.lockChoice || !document.getElementById("regnoButtons").classList.contains("hidden")) return;

      isDragging = true;
      startX = e.clientX;
      currentX = 0;
      card.classList.add("dragging");
    });

    window.addEventListener("pointermove", (e) => {
      if (!isDragging) return;
      currentX = e.clientX - startX;
      aggiornaCard(currentX);
    });

    window.addEventListener("pointerup", () => {
      if (!isDragging) return;

      isDragging = false;
      card.classList.remove("dragging");

      if (currentX > 120) {
        applicaScelta("destra");
      } else if (currentX < -120) {
        applicaScelta("sinistra");
      } else {
        resetCard();
      }
    });

    aggiornaStatistiche();
    caricaEvento();
  </script>
</body>
</html>
