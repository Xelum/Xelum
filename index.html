<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Xelum</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at top, #2a1f16 0%, #17120e 35%, #0b0b0d 100%);
      color: #f3e7d0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 520px;
    }

    .topbar {
      text-align: center;
      margin-bottom: 18px;
    }

    .title {
      font-size: 42px;
      font-weight: 700;
      letter-spacing: 1px;
      margin: 0 0 8px;
      color: #f5e6c8;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
    }

    .day {
      font-size: 16px;
      color: #d2b98b;
      letter-spacing: 0.5px;
    }

    .stats-panel {
      background: rgba(25, 20, 16, 0.92);
      border: 1px solid rgba(210, 185, 139, 0.18);
      border-radius: 18px;
      padding: 16px 14px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.35);
      margin-bottom: 18px;
      backdrop-filter: blur(3px);
    }

    .stat {
      margin-bottom: 14px;
    }

    .stat:last-child {
      margin-bottom: 0;
    }

    .stat-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 7px;
      font-size: 15px;
      color: #f2e7d3;
    }

    .stat-name {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .bar {
      width: 100%;
      height: 14px;
      background: #3a2f26;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.35s ease;
    }

    .fill-popolo {
      background: linear-gradient(90deg, #6f4fd8, #8f72ff);
    }

    .fill-esercito {
      background: linear-gradient(90deg, #6b6f7a, #a7adba);
    }

    .fill-oro {
      background: linear-gradient(90deg, #b8860b, #ffd15c);
    }

    .fill-fede {
      background: linear-gradient(90deg, #7a5a2b, #d9b26b);
    }

    .card-wrap {
      perspective: 1000px;
    }

    .card {
      background:
        linear-gradient(180deg, rgba(61, 47, 33, 0.97), rgba(33, 26, 21, 0.97));
      border: 1px solid rgba(222, 190, 134, 0.22);
      border-radius: 24px;
      padding: 30px 24px;
      min-height: 280px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at top, rgba(255, 220, 160, 0.08), transparent 40%);
      pointer-events: none;
    }

    .card-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #c7ab78;
      margin-bottom: 14px;
    }

    .card-text {
      font-size: 28px;
      line-height: 1.35;
      color: #fff5df;
      max-width: 400px;
      position: relative;
      z-index: 1;
    }

    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 14px 18px;
      min-width: 180px;
      font-size: 16px;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease, background 0.2s ease;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    button:hover {
      transform: translateY(-1px);
    }

    .choice-btn {
      background: #e6d1a5;
      color: #2a2118;
      font-weight: 700;
    }

    .choice-btn.secondary {
      background: #c8b086;
    }

    .next-btn {
      background: #8b5e34;
      color: #fff4e2;
      font-weight: 700;
    }

    .hidden {
      display: none;
    }

    .gameover {
      color: #ffcf9d;
    }

    @media (max-width: 640px) {
      .title {
        font-size: 34px;
      }

      .card {
        min-height: 250px;
        padding: 24px 18px;
      }

      .card-text {
        font-size: 23px;
      }

      button {
        width: 100%;
        min-width: 0;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <h1 class="title">Xelum</h1>
      <div class="day">Giorno <span id="giorno">1</span> di regno</div>
    </div>

    <div class="stats-panel">
      <div class="stat">
        <div class="stat-head">
          <div class="stat-name">👥 Popolo</div>
          <div id="popoloValue">50</div>
        </div>
        <div class="bar">
          <div class="fill fill-popolo" id="popoloBar" style="width: 50%;"></div>
        </div>
      </div>

      <div class="stat">
        <div class="stat-head">
          <div class="stat-name">⚔️ Esercito</div>
          <div id="esercitoValue">50</div>
        </div>
        <div class="bar">
          <div class="fill fill-esercito" id="esercitoBar" style="width: 50%;"></div>
        </div>
      </div>

      <div class="stat">
        <div class="stat-head">
          <div class="stat-name">💰 Oro</div>
          <div id="oroValue">50</div>
        </div>
        <div class="bar">
          <div class="fill fill-oro" id="oroBar" style="width: 50%;"></div>
        </div>
      </div>

      <div class="stat">
        <div class="stat-head">
          <div class="stat-name">⛪ Fede</div>
          <div id="fedeValue">50</div>
        </div>
        <div class="bar">
          <div class="fill fill-fede" id="fedeBar" style="width: 50%;"></div>
        </div>
      </div>
    </div>

    <div class="card-wrap">
      <div class="card">
        <div class="card-label">Consiglio del regno</div>
        <div class="card-text" id="testoCarta">
          Un mercante chiede meno tasse per aiutare il popolo.
        </div>
      </div>
    </div>

    <div class="buttons" id="scelteButtons">
      <button class="choice-btn" id="btnSinistra" onclick="scegli('sinistra')">Accetta</button>
      <button class="choice-btn secondary" id="btnDestra" onclick="scegli('destra')">Rifiuta</button>
    </div>

    <div class="buttons hidden" id="regnoButtons">
      <button class="next-btn" onclick="vaiAlGiornoSuccessivo()">Vai al giorno successivo</button>
    </div>
  </div>

  <script>
    const game = {
      giorno: 1,
      popolo: 50,
      esercito: 50,
      oro: 50,
      fede: 50,
      sceltaCorrente: null,
      gameOver: false
    };

    const eventi = [
      {
        testo: "Un mercante chiede meno tasse per aiutare il popolo.",
        sinistra: {
          etichetta: "Accetta",
          testoConseguenza: "Hai abbassato le tasse. Il popolo approva, ma le casse del regno si fanno più leggere.",
          effetti: { popolo: 6, esercito: 0, oro: -6, fede: 0 }
        },
        destra: {
          etichetta: "Rifiuta",
          testoConseguenza: "Hai mantenuto le imposte. Il tesoro cresce, ma nelle strade aumenta il malcontento.",
          effetti: { popolo: -6, esercito: 0, oro: 5, fede: 0 }
        }
      },
      {
        testo: "Il comandante chiede nuovi fondi per addestrare l'esercito.",
        sinistra: {
          etichetta: "Finanzia",
          testoConseguenza: "Hai rinforzato l'addestramento. L'esercito cresce, ma l'oro diminuisce.",
          effetti: { popolo: 0, esercito: 7, oro: -7, fede: 0 }
        },
        destra: {
          etichetta: "Rifiuta",
          testoConseguenza: "Hai negato nuovi fondi. Il tesoro regge, ma i soldati si sentono trascurati.",
          effetti: { popolo: 0, esercito: -7, oro: 3, fede: 0 }
        }
      },
      {
        testo: "Un vescovo chiede una donazione per restaurare il tempio.",
        sinistra: {
          etichetta: "Dona",
          testoConseguenza: "Il tempio verrà restaurato. La fede si rafforza, ma spendi parte del tesoro.",
          effetti: { popolo: 0, esercito: 0, oro: -5, fede: 8 }
        },
        destra: {
          etichetta: "Rifiuta",
          testoConseguenza: "Hai rifiutato l'offerta. Conservi oro, ma il clero guarda con freddezza il trono.",
          effetti: { popolo: 0, esercito: 0, oro: 2, fede: -7 }
        }
      },
      {
        testo: "I contadini chiedono più grano dai magazzini reali.",
        sinistra: {
          etichetta: "Concedi",
          testoConseguenza: "Hai aperto i granai. Il popolo ti acclama, ma le riserve del regno si riducono.",
          effetti: { popolo: 8, esercito: 0, oro: -5, fede: 0 }
        },
        destra: {
          etichetta: "Nega",
          testoConseguenza: "Hai protetto le scorte. Il regno conserva risorse, ma il popolo soffre.",
          effetti: { popolo: -8, esercito: 0, oro: 3, fede: 0 }
        }
      }
    ];

    function limitaStat(valore) {
      if (valore < 0) return 0;
      if (valore > 100) return 100;
      return valore;
    }

    function aggiornaStatistiche() {
      document.getElementById("giorno").textContent = game.giorno;

      document.getElementById("popoloValue").textContent = game.popolo;
      document.getElementById("esercitoValue").textContent = game.esercito;
      document.getElementById("oroValue").textContent = game.oro;
      document.getElementById("fedeValue").textContent = game.fede;

      document.getElementById("popoloBar").style.width = game.popolo + "%";
      document.getElementById("esercitoBar").style.width = game.esercito + "%";
      document.getElementById("oroBar").style.width = game.oro + "%";
      document.getElementById("fedeBar").style.width = game.fede + "%";
    }

    function mostraSezione(nome) {
      document.getElementById("scelteButtons").classList.add("hidden");
      document.getElementById("regnoButtons").classList.add("hidden");
      document.getElementById(nome).classList.remove("hidden");
    }

    function caricaEvento() {
      if (game.gameOver) return;

      const evento = eventi[Math.floor(Math.random() * eventi.length)];
      game.sceltaCorrente = evento;

      document.getElementById("testoCarta").textContent = evento.testo;
      document.getElementById("testoCarta").classList.remove("gameover");

      document.getElementById("btnSinistra").textContent = evento.sinistra.etichetta;
      document.getElementById("btnDestra").textContent = evento.destra.etichetta;

      mostraSezione("scelteButtons");
    }

    function scegli(lato) {
      if (game.gameOver) return;

      const scelta = game.sceltaCorrente[lato];
      const effetti = scelta.effetti;

      game.popolo = limitaStat(game.popolo + effetti.popolo);
      game.esercito = limitaStat(game.esercito + effetti.esercito);
      game.oro = limitaStat(game.oro + effetti.oro);
      game.fede = limitaStat(game.fede + effetti.fede);
      game.giorno += 1;

      aggiornaStatistiche();

      if (
        game.popolo === 0 ||
        game.esercito === 0 ||
        game.oro === 0 ||
        game.fede === 0
      ) {
        game.gameOver = true;
        document.getElementById("testoCarta").textContent =
          scelta.testoConseguenza +
          " Il tuo regno è crollato: una delle risorse è arrivata a zero.";
        document.getElementById("testoCarta").classList.add("gameover");
        document.getElementById("scelteButtons").classList.add("hidden");
        document.getElementById("regnoButtons").classList.add("hidden");
        return;
      }

      document.getElementById("testoCarta").textContent = scelta.testoConseguenza;
      mostraSezione("regnoButtons");
    }

    function vaiAlGiornoSuccessivo() {
      caricaEvento();
    }

    aggiornaStatistiche();
    caricaEvento();
  </script>
</body>
</html>
