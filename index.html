<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xelum</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{

font-family:Georgia, "Times New Roman", serif;

background:
radial-gradient(circle at top,#2a1f16 0%,#17120e 40%,#0b0b0d 100%);

color:#f5e6c8;

height:100vh;

display:flex;
justify-content:center;
align-items:center;

overflow:hidden;

}


/* CONTAINER */

.home{

text-align:center;
width:100%;
max-width:600px;

}


/* TITOLO */

.logo{

font-size:96px;

letter-spacing:10px;

font-weight:700;

color:#f5e6c8;

text-shadow:
0 0 15px rgba(255,220,160,0.25),
0 0 35px rgba(0,0,0,0.6);

animation:logoPulse 3s ease-in-out infinite alternate;

margin-bottom:40px;

}

@keyframes logoPulse{

from{

transform:scale(1);

text-shadow:
0 0 12px rgba(255,220,160,0.2),
0 0 35px rgba(0,0,0,0.6);

}

to{

transform:scale(1.06);

text-shadow:
0 0 25px rgba(255,220,160,0.5),
0 0 45px rgba(0,0,0,0.7);

}

}


/* MENU */

.menu{

display:flex;
flex-direction:column;
gap:16px;

}


/* BOTTONI */

.menu button{

background:linear-gradient(180deg,#8b5e34,#6e4725);

border:none;

border-radius:14px;

padding:16px;

font-size:20px;

color:#fff4e2;

cursor:pointer;

transition:all .2s ease;

box-shadow:0 10px 25px rgba(0,0,0,.4);

}

.menu button:hover{

transform:translateY(-3px) scale(1.03);

box-shadow:0 14px 35px rgba(0,0,0,.5);

}


/* POPUP */

.popup{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,.75);

display:flex;

justify-content:center;
align-items:center;

visibility:hidden;
opacity:0;

transition:opacity .3s;

}

.popup.active{

visibility:visible;
opacity:1;

}


.popup-box{

background:#1b1612;

padding:35px;

border-radius:18px;

max-width:450px;

text-align:center;

border:1px solid rgba(255,220,160,0.2);

box-shadow:0 20px 40px rgba(0,0,0,.6);

}


.popup-box h2{

margin-bottom:12px;

font-size:28px;

}


.popup-box p{

line-height:1.5;

color:#e7d7b7;

margin-bottom:18px;

}


.close-btn{

background:#8b5e34;

border:none;

padding:12px 18px;

border-radius:10px;

color:white;

cursor:pointer;

}


/* FOOTER */

.footer{

position:absolute;

bottom:20px;

width:100%;

text-align:center;

font-size:13px;

opacity:.6;

}

</style>

</head>



<body>

<div class="home">

<h1 class="logo">XELUM</h1>

<div class="menu">

<button onclick="nuovoRegno()">Nuovo Regno</button>

<button onclick="continuaRegno()">Continua Regno</button>

<button onclick="openPopup('impostazioni')">Impostazioni</button>

<button onclick="openPopup('tutorial')">Tutorial</button>

<button onclick="openPopup('donazioni')">Donazioni</button>

</div>

</div>



<div class="popup" id="popup">

<div class="popup-box">

<h2 id="popupTitle"></h2>

<p id="popupText"></p>

<button class="close-btn" onclick="closePopup()">Chiudi</button>

</div>

</div>



<div class="footer">

Xelum - Gioco strategico narrativo

</div>



<script>


function nuovoRegno(){

window.location.href="game.html";

}


function continuaRegno(){

window.location.href="game.html";

}



function openPopup(type){

const popup=document.getElementById("popup");
const title=document.getElementById("popupTitle");
const text=document.getElementById("popupText");


if(type==="impostazioni"){

title.innerText="Impostazioni";

text.innerText="Qui potrai gestire musica, animazioni e preferenze del gioco.";

}


if(type==="tutorial"){

title.innerText="Tutorial";

text.innerText="In Xelum governi il regno prendendo decisioni. Scorri la carta a sinistra o destra per scegliere. Ogni decisione influenza Popolo, Esercito, Oro e Fede.";

}


if(type==="donazioni"){

title.innerText="Supporta Xelum";

text.innerText="Se vuoi supportare lo sviluppo del gioco potrai farlo qui in futuro.";

}


popup.classList.add("active");

}


function closePopup(){

document.getElementById("popup").classList.remove("active");

}

</script>


</body>
</html>
