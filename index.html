<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xelum</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      max-width: 700px;
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
    }

    .day {
      margin-bottom: 20px;
      font-size: 18px;
      opacity: 0.9;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-box {
      background: #1b1b1b;
      padding: 12px;
      border-radius: 10px;
    }

    .card {
      background: #1e1e1e;
      padding: 30px 20px;
      border-radius: 14px;
      margin-bottom: 20px;
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.5;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    button {
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      background: #3a86ff;
      color: white;
      font-size: 16px;
      cursor: pointer;
      min-width: 190px;
    }

    button:hover {
      background: #2f6ed1;
    }

    .hidden {
      display: none;
    }

    @media (min-width: 700px) {
      .stats {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Xelum</h1>
    <div class="day">Giorno: <span id="giorno">1</span></div>

    <div class="stats">
      <div class="stat-box">👥 Popolo: <span id="popolo">50</span></div>
      <div class="stat-box">⚔️ Esercito: <span id="esercito">50</span></div>
      <div class="stat-box">💰 Oro: <span id="oro">50</span></div>
      <div class="stat-box">⛪ Fede: <span id="fede">50</span></div>
    </div>

    <div class="card" id="testoCarta">
      Un mercante chiede meno tasse per aiutare il popolo.
    </div>

    <div class="buttons" id="scelteButtons">
      <button id="btnSinistra" onclick="scegli('sinistra')">Accetta</button>
      <button id="btnDestra" onclick="scegli('destra')">Rifiuta</button>
    </div>

    <div class="buttons hidden" id="regnoButtons">
      <button onclick="vaiAlGiornoSuccessivo()">Vai al giorno successivo</button>
    </div>
  </div>

  <script>
    let game = {
      giorno: 1,
      popolo: 50,
      esercito: 50,
      oro: 50,
      fede: 50,
      sceltaCorrente: null,
      gameOver: false
    };

    const eventi = [
      {
        testo: "Un mercante chiede meno tasse per aiutare il popolo.",
        sinistra: {
          etichetta: "Accetta",
          testoConseguenza: "Hai abbassato le tasse. Il popolo è soddisfatto, ma le casse del regno si alleggeriscono.",
          effetti: { popolo: +5, esercito: 0, oro: -5, fede: 0 }
        },
        destra: {
          etichetta: "Rifiuta",
          testoConseguenza: "Hai mantenuto le tasse. Il tesoro cresce, ma il popolo rumoreggia.",
          effetti: { popolo: -5, esercito: 0, oro: +5, fede: 0 }
        }
      },
      {
        testo: "Il comandante chiede nuovi fondi per addestrare l'esercito.",
        sinistra: {
          etichetta: "Finanzia",
          testoConseguenza: "Hai investito nell'esercito. I soldati sono più forti, ma l'oro diminuisce.",
          effetti: { popolo: 0, esercito: +6, oro: -6, fede: 0 }
        },
        destra: {
          etichetta: "Rifiuta",
          testoConseguenza: "Hai negato i fondi. Il tesoro regge, ma l'esercito si irrita.",
          effetti: { popolo: 0, esercito: -6, oro: +2, fede: 0 }
        }
      },
      {
        testo: "Un vescovo chiede una donazione per restaurare il tempio.",
        sinistra: {
          etichetta: "Dona",
          testoConseguenza: "La Chiesa ti guarda con favore, ma spendi parte del tesoro.",
          effetti: { popolo: 0, esercito: 0, oro: -4, fede: +7 }
        },
        destra: {
          etichetta: "Rifiuta",
          testoConseguenza: "Hai negato l'offerta. Risparmi oro, ma la fede del regno si indebolisce.",
          effetti: { popolo: 0, esercito: 0, oro: +2, fede: -6 }
        }
      }
    ];

    function limitaStat(valore) {
      if (valore < 0) return 0;
      if (valore > 100) return 100;
      return valore;
    }

    function aggiornaStatistiche() {
      document.getElementById("giorno").innerText = game.giorno;
      document.getElementById("popolo").innerText = game.popolo;
      document.getElementById("esercito").innerText = game.esercito;
      document.getElementById("oro").innerText = game.oro;
      document.getElementById("fede").innerText = game.fede;
    }

    function mostraSezione(nome) {
      document.getElementById("scelteButtons").classList.add("hidden");
      document.getElementById("regnoButtons").classList.add("hidden");

      document.getElementById(nome).classList.remove("hidden");
    }

    function caricaEvento() {
      if (game.gameOver) return;

      const evento = eventi[Math.floor(Math.random() * eventi.length)];
      game.sceltaCorrente = evento;

      document.getElementById("testoCarta").innerText = evento.testo;
      document.getElementById("btnSinistra").innerText = evento.sinistra.etichetta;
      document.getElementById("btnDestra").innerText = evento.destra.etichetta;

      mostraSezione("scelteButtons");
    }

    function scegli(lato) {
      if (game.gameOver) return;

      const scelta = game.sceltaCorrente[lato];
      const effetti = scelta.effetti;

      game.popolo = limitaStat(game.popolo + effetti.popolo);
      game.esercito = limitaStat(game.esercito + effetti.esercito);
      game.oro = limitaStat(game.oro + effetti.oro);
      game.fede = limitaStat(game.fede + effetti.fede);
      game.giorno += 1;

      aggiornaStatistiche();

      if (game.popolo === 0 || game.esercito === 0 || game.oro === 0 || game.fede === 0) {
        game.gameOver = true;
        document.getElementById("testoCarta").innerText =
          scelta.testoConseguenza +
          " Fine del regno: una delle risorse è arrivata a zero.";
        document.getElementById("scelteButtons").classList.add("hidden");
        document.getElementById("regnoButtons").classList.add("hidden");
        return;
      }

      document.getElementById("testoCarta").innerText = scelta.testoConseguenza;
      mostraSezione("regnoButtons");
    }

    function vaiAlGiornoSuccessivo() {
      caricaEvento();
    }

    aggiornaStatistiche();
    caricaEvento();
  </script>
</body>
</html>
