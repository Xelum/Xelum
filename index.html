<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xelum</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#111;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:90%;
    max-width:600px;
    text-align:center;
}

.card{
    background:#1e1e1e;
    padding:30px;
    border-radius:10px;
    margin-bottom:20px;
}

button{
    padding:15px 20px;
    margin:10px;
    border:none;
    border-radius:8px;
    background:#3a86ff;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#2a6fd6;
}

.stats{
    display:flex;
    justify-content:space-between;
    margin-bottom:20px;
}

</style>

</head>

<body>

<div class="container">

<h1>Xelum</h1>

<div class="stats">
<div>👥 Popolo: <span id="popolo">50</span></div>
<div>⚔️ Esercito: <span id="esercito">50</span></div>
<div>💰 Oro: <span id="oro">50</span></div>
<div>⛪ Fede: <span id="fede">50</span></div>
</div>

<div class="card" id="evento">
Un mercante chiede meno tasse per aiutare il popolo.
</div>

<button onclick="sceltaSinistra()">Accetta</button>
<button onclick="sceltaDestra()">Rifiuta</button>

</div>

<script>

let popolo = 50
let esercito = 50
let oro = 50
let fede = 50

function aggiorna(){
document.getElementById("popolo").innerText = popolo
document.getElementById("esercito").innerText = esercito
document.getElementById("oro").innerText = oro
document.getElementById("fede").innerText = fede
}

function sceltaSinistra(){
popolo += 5
oro -= 5
aggiorna()
}

function sceltaDestra(){
popolo -= 5
oro += 5
aggiorna()
}

</script>

</body>
</html>
