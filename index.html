<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xelum</title>

<style>

*{
box-sizing:border-box;
user-select:none;
}

body{
margin:0;
font-family:Georgia,serif;
background:radial-gradient(circle at top,#2a1f16,#0b0b0d);
color:#f3e7d0;
display:flex;
justify-content:center;
padding:20px;
}

.app{
width:100%;
max-width:560px;
}

.topbar{
text-align:center;
margin-bottom:18px;
}

.title{
font-size:34px;
font-weight:700;
color:#f5e6c8;
margin-bottom:6px;
}

.king-name{
font-size:15px;
color:#d7c29a;
}

.stats-panel{
background:#191410;
border-radius:18px;
padding:16px;
margin-bottom:18px;
}

.stat{
margin-bottom:14px;
}

.stat-head{
display:flex;
justify-content:space-between;
font-size:15px;
margin-bottom:6px;
}

.bar{
height:14px;
background:#3a2f26;
border-radius:999px;
overflow:hidden;
}

.fill{
height:100%;
border-radius:999px;
transition:width .3s;
}

.fill-popolo{
background:linear-gradient(90deg,#2f6b35,#63b36d);
}

.fill-esercito{
background:linear-gradient(90deg,#7a1f1f,#cf5b5b);
}

.fill-oro{
background:linear-gradient(90deg,#b8860b,#ffd15c);
}

.fill-fede{
background:linear-gradient(90deg,#5b3d8b,#a47ae8);
}

.card-area{
height:380px;
position:relative;
}

.card{
position:absolute;
inset:0;
background:#3d2f21;
border-radius:24px;
padding:20px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
cursor:grab;
transition:transform .25s,opacity .25s;
}

.card-text{
font-size:26px;
color:#fff5df;
}

.scene-image{
height:110px;
width:100%;
margin-bottom:12px;
display:flex;
align-items:center;
justify-content:center;
border-radius:14px;
background:#4a3826;
color:#d8c29c;
font-size:13px;
text-transform:uppercase;
}

.choice-hint{
position:absolute;
top:16px;
font-size:14px;
opacity:0;
}

.choice-left{
left:10px;
color:#d96a6a;
}

.choice-right{
right:10px;
color:#7ed48a;
}

.choice-hint.visible{
opacity:1;
}

.buttons{
display:flex;
justify-content:center;
margin-top:18px;
}

button{
border:none;
border-radius:14px;
padding:14px 20px;
background:#8b5e34;
color:white;
font-size:16px;
cursor:pointer;
}

.hidden{
display:none;
}

.summary{
background:#191410;
border-radius:18px;
padding:18px;
margin-top:18px;
}

.page-turn{
position:fixed;
inset:0;
background:#2b1e14;
transform:translateX(-100%);
z-index:100;
}

.page-turn.animate{
animation:turnPage .8s forwards;
}

@keyframes turnPage{
0%{transform:translateX(-100%)}
50%{transform:translateX(0)}
100%{transform:translateX(100%)}
}

</style>
</head>

<body>

<div class="page-turn hidden" id="pageTurn"></div>

<div class="app">

<div class="topbar">
<h1 class="title">Giorno <span id="giorno">1</span> del regno</h1>
<div class="king-name">Re in carica: <span id="nomeRe"></span></div>
</div>

<div class="stats-panel">

<div class="stat">
<div class="stat-head">
<span>👥 Popolo</span>
<span id="popoloValue">50</span>
</div>
<div class="bar">
<div class="fill fill-popolo" id="popoloBar" style="width:50%"></div>
</div>
</div>

<div class="stat">
<div class="stat-head">
<span>⚔️ Esercito</span>
<span id="esercitoValue">50</span>
</div>
<div class="bar">
<div class="fill fill-esercito" id="esercitoBar" style="width:50%"></div>
</div>
</div>

<div class="stat">
<div class="stat-head">
<span>💰 Oro</span>
<span id="oroValue">50</span>
</div>
<div class="bar">
<div class="fill fill-oro" id="oroBar" style="width:50%"></div>
</div>
</div>

<div class="stat">
<div class="stat-head">
<span>⛪ Fede</span>
<span id="fedeValue">50</span>
</div>
<div class="bar">
<div class="fill fill-fede" id="fedeBar" style="width:50%"></div>
</div>
</div>

</div>

<div class="card-area">

<div class="choice-hint choice-left" id="leftHint"></div>
<div class="choice-hint choice-right" id="rightHint"></div>

<div class="card" id="gameCard">

<div class="scene-image">Consiglio del regno</div>

<div class="card-text" id="testoCarta">
Un mercante chiede meno tasse per aiutare il popolo.
</div>

</div>

</div>

<div class="buttons hidden" id="regnoButtons">
<button onclick="vaiAlGiornoSuccessivo()">Vai al giorno successivo</button>
</div>

<div class="summary hidden" id="summaryBox">

<h2>Fine del regno</h2>

<p>Sovrano: <span id="summaryRe"></span></p>
<p>Durata: <span id="summaryDurata"></span></p>
<p>Popolo <span id="summaryPopolo"></span></p>
<p>Esercito <span id="summaryEsercito"></span></p>
<p>Oro <span id="summaryOro"></span></p>
<p>Fede <span id="summaryFede"></span></p>

<button onclick="nuovoRegno()">Nuovo regno</button>

</div>

</div>

<script>

const praenomina=["Lucius","Marcus","Gaius","Tiberius","Quintus"];
const nomina=["Aurelius","Severus","Valerius","Cassianus","Octavianus"];

const eventi=[
{
testo:"Un mercante chiede meno tasse per aiutare il popolo.",
sinistra:{etichetta:"Rifiuta",effetti:{popolo:-6,oro:5}},
destra:{etichetta:"Accetta",effetti:{popolo:6,oro:-6}}
}
];

const game={
giorno:1,
popolo:50,
esercito:50,
oro:50,
fede:50,
nomeRe:"",
sceltaCorrente:null
};

function nomeLatino(){
return praenomina[Math.floor(Math.random()*praenomina.length)]+" "+nomina[Math.floor(Math.random()*nomina.length)];
}

function aggiornaStatistiche(){

document.getElementById("giorno").textContent=game.giorno;

document.getElementById("popoloValue").textContent=game.popolo;
document.getElementById("esercitoValue").textContent=game.esercito;
document.getElementById("oroValue").textContent=game.oro;
document.getElementById("fedeValue").textContent=game.fede;

document.getElementById("popoloBar").style.width=game.popolo+"%";
document.getElementById("esercitoBar").style.width=game.esercito+"%";
document.getElementById("oroBar").style.width=game.oro+"%";
document.getElementById("fedeBar").style.width=game.fede+"%";

}

function caricaEvento(){

const evento=eventi[Math.floor(Math.random()*eventi.length)];
game.sceltaCorrente=evento;

document.getElementById("testoCarta").textContent=evento.testo;

}

function animaCambioGiorno(cb){

const page=document.getElementById("pageTurn");

page.classList.remove("hidden");
page.classList.add("animate");

setTimeout(()=>{
cb();
},400);

setTimeout(()=>{
page.classList.remove("animate");
page.classList.add("hidden");
},800);

}

function vaiAlGiornoSuccessivo(){

animaCambioGiorno(()=>{
game.giorno++;
caricaEvento();
aggiornaStatistiche();
});

}

function nuovoRegno(){

game.nomeRe=nomeLatino();
game.giorno=1;
game.popolo=50;
game.esercito=50;
game.oro=50;
game.fede=50;

document.getElementById("nomeRe").textContent=game.nomeRe;

aggiornaStatistiche();
caricaEvento();

}

nuovoRegno();

</script>

</body>
</html>
